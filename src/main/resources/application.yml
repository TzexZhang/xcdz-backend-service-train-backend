server:
  port: 9700
  tomcat:
    threads:
      max: 800
      min-spare: 150
    accept-count: 500
    connection-timeout: 30000
    max-connections: 10000
spring:
  application:
    name: xcdz-backend-service
  profiles:
    active: prod
  # ========== Kafka（CDC 事件消费）==========
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: xcdz-push
      # 无位点时从最早开始（topic 内均为 CDC 增量事件，不含存量）
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # 批量消费:一批事件一次持锁分发（水位/seq 批内连续）
      type: batch
      ack-mode: batch
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache3.xml
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    url: jdbc:mysql://localhost:3306/train?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&useAffectedRows=true
    password: password
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000
      auto-commit: true
      validation-timeout: 5000
      leak-detection-threshold: 5000
      pool-name: CXHikariPool
  
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xcdz.service.**.entity
  global-config:
    db-config:
      id-type: assign_id
  configuration:
    jdbc-type-for-null: null
    map-underscore-to-camel-case: true
    cache-enabled: true
    default-executor-type: reuse
    default-fetch-size: 500
    default-statement-timeout: 5000
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #org.apache.ibatis.logging.nologging.NoLoggingImpl #org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: /data/java/logs
    name: xcdz-backend-service

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true

# ========== Knife4j 接口文档配置 ==========
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha              # 接口分组按字母排序
    operations-sorter: alpha        # 接口方法按字母排序
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.xcdz.service.controller

knife4j:
  enable: true
  setting:
    language: zh_cn                 # 中文界面
    enable-version: true            # 显示接口版本信息
    enable-reload-cache-parameter: false

# ========== 实时推送（CDC 方案）==========
push:
  # WebSocket 背压保护（慢消费者阈值，超限断连、重连即完整快照自愈）
  ws:
    send-time-limit-ms: 5000        # 单次发送超时毫秒数
    buffer-size-limit-bytes: 524288 # 单连接发送缓冲字节上限（512KB）
  # Debezium CDC topic（默认命名 {topic.prefix}.{db}.{table}）
  cdc:
    track-topic: xcdz.train.track   # track 表变更事件
    target-topic: xcdz.train.target # target 表变更事件（维度缓存维护）
