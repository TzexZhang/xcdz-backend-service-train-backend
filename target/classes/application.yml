server:
  port: 9700
  tomcat:
    threads:
      max: 800
      min-spare: 150
    accept-count: 500
    connection-timeout: 30000
    max-connections: 10000
spring:
  application:
    name: xcdz-backend-service
  profiles:
    active: prod
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache3.xml
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    url: jdbc:mysql://localhost:3306/train?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&useAffectedRows=true
    password: password
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000
      auto-commit: true
      validation-timeout: 5000
      leak-detection-threshold: 5000
      pool-name: CXHikariPool
  
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xcdz.service.**.entity
  global-config:
    db-config:
      id-type: assign_id
  configuration:
    jdbc-type-for-null: null
    map-underscore-to-camel-case: true
    cache-enabled: true
    default-executor-type: reuse
    default-fetch-size: 500
    default-statement-timeout: 5000
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #org.apache.ibatis.logging.nologging.NoLoggingImpl #org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: /data/java/logs
    name: xcdz-backend-service

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true

# ========== Knife4j 接口文档配置 ==========
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha              # 接口分组按字母排序
    operations-sorter: alpha        # 接口方法按字母排序
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.xcdz.service.controller

knife4j:
  enable: true
  setting:
    language: zh_cn                 # 中文界面
    enable-version: true            # 显示接口版本信息
    enable-reload-cache-parameter: false
